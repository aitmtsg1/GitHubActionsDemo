name: NASDAQ Analyzer (GH-hosted)

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 7 * * *'    # daily at 07:00 UTC; change if desired
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r nasdaq_analyzer/requirements.txt

      - name: Run analyzer (sample)
        run: |
          mkdir -p outputs
          # Use --sample 200 for initial test to avoid long runs and rate limits
          python nasdaq_analyzer/analyze.py --sample 200 --out-prefix outputs/nasdaq

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: nasdaq-results
          path: outputs/
